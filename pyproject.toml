# Ruff configuration only. Odoo packaging lives in the addon directory:
# partner_autocomplete_manual/pyproject.toml uses the whool build backend.
#
# NOTE: requirements.txt is written by hand: OCA's oca-gen-external-dependencies
# hook has a bug upstream (Path.glob(cwd, "*/pyproject.toml") never matches a
# pyproject.toml at the repo root), so it returns 1 and generates nothing.
[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["dev-tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4", "SIM", "PIE"]
ignore = [
  # Odoo addons use star imports of modules in __init__ files
  "F401",
]

[tool.ruff.format]
quote-style = "double"
